<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard - Operasional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body class="bg-gray-50 font-sans min-h-screen flex flex-col">
    <!-- Header -->
    <header
      class="bg-white border-b p-4 flex justify-between items-center shadow-sm sticky top-0 z-10"
    >
      <div class="flex items-center gap-4">
        <a
          href="index.html"
          class="text-gray-500 hover:text-blue-600 transition-colors"
          title="Kembali ke Portal"
          ><i class="fa-solid fa-arrow-left text-lg"></i
        ></a>
        <h1 class="text-xl font-bold text-blue-600 flex items-center gap-2">
          <i class="fa-solid fa-bolt"></i> Ada Laundry Admin
        </h1>
      </div>
      <span class="text-gray-500 text-sm hidden sm:inline"
        >Mode: Operasional Harian</span
      >
    </header>
    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-6 lg:p-8 max-w-7xl mx-auto w-full space-y-6">
      <h2 class="text-2xl font-bold text-gray-800">Dashboard Operasional</h2>
      <!-- KPI -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div
          class="bg-blue-50 border border-blue-100 p-4 rounded-xl flex items-center justify-between"
        >
          <div>
            <p class="text-blue-600 text-sm font-semibold">Pesanan Baru</p>
            <p class="text-3xl font-bold text-blue-900">24</p>
          </div>
          <i class="fa-solid fa-clipboard-list text-4xl text-blue-300"></i>
        </div>
        <div
          class="bg-orange-50 border border-orange-100 p-4 rounded-xl flex items-center justify-between"
        >
          <div>
            <p class="text-orange-600 text-sm font-semibold">Mendekati SLA</p>
            <p class="text-3xl font-bold text-orange-900">3</p>
          </div>
          <i class="fa-regular fa-clock text-4xl text-orange-300"></i>
        </div>
        <div
          class="bg-green-50 border border-green-100 p-4 rounded-xl flex items-center justify-between"
        >
          <div>
            <p class="text-green-600 text-sm font-semibold">
              Antrean Pengiriman
            </p>
            <p class="text-3xl font-bold text-green-900">12</p>
          </div>
          <i class="fa-solid fa-truck text-4xl text-green-300"></i>
        </div>
      </div>
      <!-- Table -->
      <div class="bg-white rounded-xl shadow-sm border p-4">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-lg font-bold">Manajemen Pesanan Aktif</h3>
          <div class="relative">
            <i
              class="fa-solid fa-search absolute left-3 top-3.5 text-gray-400 text-sm"
            ></i>
            <input
              type="text"
              id="searchInput"
              placeholder="Cari ID/Nama..."
              class="pl-9 pr-4 py-2 bg-gray-100 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            />
          </div>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-left" id="orderTable">
            <thead class="bg-gray-50 text-gray-600">
              <tr>
                <th class="p-3">ID Pesanan</th>
                <th class="p-3">Pelanggan</th>
                <th class="p-3">Status Saat Ini</th>
                <th class="p-3">Tindakan</th>
              </tr>
            </thead>
            <tbody class="divide-y">
              <tr class="order-row">
                <td class="p-3 font-medium">#ORD-099</td>
                <td class="p-3 customer-name">Budi Santoso</td>
                <td class="p-3">
                  <select
                    class="bg-orange-100 text-orange-700 p-1.5 rounded text-xs font-semibold border-none outline-none"
                  >
                    <option>Menunggu Pick-up</option>
                    <option>Tiba di Laundry</option>
                    <option>Dicuci</option>
                  </select>
                </td>
                <td class="p-3 flex gap-2">
                  <button
                    class="p-2 bg-blue-100 text-blue-600 rounded hover:bg-blue-200"
                    onclick="alert('Mencetak label...')"
                  >
                    <i class="fa-solid fa-print"></i>
                  </button>
                </td>
              </tr>
              <tr class="order-row">
                <td class="p-3 font-medium">#ORD-098</td>
                <td class="p-3 customer-name">Siti Aminah</td>
                <td class="p-3">
                  <select
                    class="bg-blue-100 text-blue-700 p-1.5 rounded text-xs font-semibold border-none outline-none"
                  >
                    <option>Disetrika</option>
                    <option>Siap Dikirim</option>
                    <option>Selesai</option>
                  </select>
                </td>
                <td class="p-3 flex gap-2">
                  <button
                    class="p-2 bg-blue-100 text-blue-600 rounded hover:bg-blue-200"
                    onclick="alert('Mencetak label...')"
                  >
                    <i class="fa-solid fa-print"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
    <script>
      // Fitur Filter/Pencarian JavaScript sederhana         document.getElementById('searchInput').addEventListener('keyup', function(e) {             const term = e.target.value.toLowerCase();             const rows = document.querySelectorAll('.order-row');             rows.forEach(row => {                 const text = row.innerText.toLowerCase();                 row.style.display = text.includes(term) ? '' : 'none';             });         });
    </script>
  </body>
</html>
